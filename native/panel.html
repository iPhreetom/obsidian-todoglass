<body>
<main class="surface" id="surface">
<header class="titlebar" id="dragHandle">
<div class="brand"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8 12 3 3 5-6"/></svg><span>TODOGLASS</span></div>

</div></header>

<div class="popover" id="settingsPopover"><h2>浮窗偏好</h2><div class="setting-row"><label for="themeSelect">外观</label><select id="themeSelect"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="setting-row"><label for="opacityRange">背景不透明度</label><input id="opacityRange" aria-label="背景不透明度" title="0% 完全透明，100% 实色背景；文字始终清晰" type="range" min="0" max="100" value="12"></div><div class="setting-row"><label for="alwaysOnTop">始终置顶</label><input type="checkbox" id="alwaysOnTop" checked></div><hr><button class="menu-button" id="openSettings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>Obsidian 插件设置</button><button class="menu-button" id="hideButton"><svg viewBox="0 0 24 24"><path d="M3 3 21 21M10 10a3 3 0 0 0 4 4"/><path d="M6 6c-2 2-3 4-3 6 4 7 14 7 18 0a17 17 0 0 0-5-5M10 5c4-1 8 2 11 7"/></svg>隐藏浮窗</button></div>

</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const svgPaths = {
 plus:'M12 5v14M5 12h14', check:'m5 12 4 4L19 6', chevron:'m9 5 7 7-7 7', edit:'m15 4 5 5M4 20l5-1L21 7l-4-4L5 15l-1 5', more:'M5 12h.01M12 12h.01M19 12h.01', clock:'M12 8v4l3 2', cancel:'m7 7 10 10M17 7 7 17', arrow:'M5 12h14m-5-5 5 5-5 5', circle:'M12 5a7 7 0 1 1 0 14 7 7 0 0 1 0-14', inbox:'M4 6h16v13H4zM4 13h5l2 3h2l2-3h5', leaf:'M5 19c1-10 4-14 15-14 0 11-4 14-14 14M6 18 16 8', child:'M6 4v8h12m-4-4 4 4-4 4'
};
function icon(name){const n=document.createElementNS('http://www.w3.org/2000/svg','svg');n.setAttribute('viewBox','0 0 24 24');n.setAttribute('aria-hidden','true');const p=document.createElementNS(n.namespaceURI,'path');p.setAttribute('d',svgPaths[name]||svgPaths.circle);n.append(p);if(name==='clock'){const c=document.createElementNS(n.namespaceURI,'circle');c.setAttribute('cx','12');c.setAttribute('cy','12');c.setAttribute('r','8');n.prepend(c);}return n;}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function button(cls,title,iconName,click){const b=el('button',cls);b.type='button';b.title=title;b.setAttribute('aria-label',title);if(iconName)b.append(icon(iconName));if(click)b.addEventListener('click',click);return b;}
let state={tasks:[],connected:false,exists:false,preferences:{}};
let editing=null, draft=null, collapsed=false;
let lastFingerprint='', deferredRender=false, toastTimer=null, menu=null;
const folded=new Set(), pendingTasks=new Set(), pending=new Map();
try{for(const key of JSON.parse(localStorage.getItem('todoglass.folded')||'[]'))if(typeof key==='string')folded.add(key);}catch{}
function foldKey(task){return task?.uiKey||task?.id;}
function persistFolds(){try{localStorage.setItem('todoglass.folded',JSON.stringify([...folded].slice(-500)));}catch{}}
let sequence=0;
function bridge(message){const native=window.webkit?.messageHandlers?.todoglass;if(!native){return false;}native.postMessage(message);return true;}
function toast(message,error=false){$('toast').textContent=message;$('toast').classList.toggle('error',error);$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),error?5500:2200);}
function sendAction(action){return new Promise((resolve,reject)=>{if(!state.connected){reject(new Error('与 Obsidian 的连接已断开，请先恢复连接。'));return;}const requestId='ui-'+Date.now()+'-'+(++sequence);const timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('保存超时，请先检查日记是否已更新。'));},10000);pending.set(requestId,{resolve,reject,timer});if(!bridge({type:'action',requestId,action})){clearTimeout(timer);pending.delete(requestId);reject(new Error('请从 Obsidian 插件打开浮窗。'));}});}
function isDone(task){return task.status==='done'||task.status==='cancelled';}
function taskMap(){return new Map(state.tasks.map(t=>[t.id,t]));}
// Each status group is its own forest. A task whose immediate parent is in
// another group becomes a root here, so guides never point at a hidden parent.
function visibleTree(tasks,expandAll=false){
 const nodes=new Map(tasks.map(task=>[task.id,{task,parent:null,children:[]}]));
 for(const node of nodes.values()){
  const parent=nodes.get(node.task.parentId);if(!parent||parent===node)continue;
  let cursor=parent,cycle=false;const seen=new Set([node.task.id]);
  while(cursor){if(seen.has(cursor.task.id)){cycle=true;break;}seen.add(cursor.task.id);cursor=nodes.get(cursor.task.parentId);}
  if(!cycle){node.parent=parent;parent.children.push(node);}
 }
 const rows=[];
 function count(node){return node.children.reduce((n,child)=>n+1+count(child),0);}
 function visit(siblings,depth,continuations){siblings.forEach((node,index)=>{
  const hasNext=index<siblings.length-1;
  const isFolded=!expandAll&&folded.has(foldKey(node.task));
  rows.push({task:node.task,tree:{depth,hasNext,continuations,allowFold:!expandAll,childCount:count(node),hasVisibleChildren:node.children.length>0&&!isFolded}});
  if(!isFolded)visit(node.children,depth+1,depth?continuations.concat(hasNext):[]);
 });}
 visit([...nodes.values()].filter(node=>!node.parent),0,[]);return rows;
}
function appendTreeGuides(row,tree){
 row.dataset.treeDepth=String(tree.depth);row.dataset.treeBranch=tree.depth?(tree.hasNext?'middle':'last'):'root';
 tree.continuations.forEach((continues,level)=>{if(!continues)return;const rail=el('span','tree-guide tree-ancestor');rail.style.setProperty('--rail-level',String(level));rail.setAttribute('aria-hidden','true');row.append(rail);});
 if(tree.depth){const rail=el('span','tree-guide tree-branch'+(tree.hasNext?'':' is-last'));rail.style.setProperty('--rail-level',String(tree.depth-1));rail.setAttribute('aria-hidden','true');row.append(rail);}
 if(tree.hasVisibleChildren){const stem=el('span','tree-stem');stem.setAttribute('aria-hidden','true');row.append(stem);}
}
function applyPreferences(preferences){const p=preferences||{};document.documentElement.dataset.theme=['light','dark'].includes(p.theme)?p.theme:'system';const opacity=typeof p.opacity==='number'?Math.max(0,Math.min(1,p.opacity)):.12;document.documentElement.style.setProperty('--opacity',opacity);$('opacityRange').value=String(Math.round(opacity*100));$('themeSelect').value=p.theme||'system';$('alwaysOnTop').checked=p.alwaysOnTop!==false;}
function preferencesChanged(p){state.preferences={...state.preferences,...p};applyPreferences(state.preferences);bridge({type:'settingsUpdate',preferences:p});}
function refreshHeader(){const done=state.tasks.filter(t=>t.status==='done').length;const total=state.tasks.filter(t=>t.status!=='cancelled').length;const remaining=state.tasks.filter(t=>!isDone(t)).length;const value=total?Math.round(done/total*100):0;$('progressFill').style.width=value+'%';$('progress').setAttribute('aria-valuenow',String(value));$('progressLabel').textContent=state.connected?(total?done+' / '+total+' 已完成':'留一点空间，给今天'):'等待连接';$('collapsedCount').textContent=remaining?'· '+remaining+' 项':'· 完成';const dateValue=state.date?new Date(state.date+'T12:00:00'):new Date();$('dateLabel').textContent=Number.isNaN(dateValue.valueOf())?String(state.date||''):new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric',weekday:'short'}).format(dateValue);$('statusDot').classList.toggle('offline',!state.connected);$('noteLink').textContent=state.connected?(state.path||state.label||'今日的日记'):'连接已断开 · 点击重试';$('noteLink').title=state.connected?'在 Obsidian 中打开 '+(state.path||'今日日记'):'重新连接 Obsidian';}
async function updateTask(task,change,path=state.path){if(editing||draft){toast('先保存或取消正在输入的内容。');return;}pendingTasks.add(task.id);renderTasks();try{await sendAction({type:'update',taskId:task.id,path,...change});toast(change.status==='done'?'已完成，已写回日记':'已更新日记');}catch(e){toast(e.message,true);}finally{pendingTasks.delete(task.id);renderTasks();}}
function closeMenu(){if(menu){menu.remove();menu=null;}}
function openStatusMenu(task,event,path){closeMenu();const node=el('div','status-menu');node.setAttribute('role','menu');const items=[['todo','待办','circle'],['doing','进行中','clock'],['done','已完成','check'],['deferred','稍后处理','arrow'],['cancelled','已取消','cancel']];for(const [status,label,ico] of items){const b=button('',label,ico,()=>{closeMenu();updateTask(task,{status},path);});b.append(el('span','',label));if(status===task.status){b.append(el('span','spacer'));b.append(icon('check'));}node.append(b);}document.body.append(node);const rect=event.currentTarget.getBoundingClientRect();const width=140,height=190;node.style.left=Math.max(8,Math.min(rect.right-width,innerWidth-width-8))+'px';node.style.top=Math.max(8,Math.min(rect.bottom+3,innerHeight-height-8))+'px';menu=node;event.stopPropagation();}
function startEdit(task,path=state.path){if(pendingTasks.has(task.id))return;if(draft){toast('先保存或取消正在新增的任务。');return;}if(editing){if(editing.id===task.id)$('taskEditor')?.focus();else toast('先保存或取消正在编辑的任务。');return;}editing={id:task.id,text:task.text,path};renderTasks(true);const input=$('taskEditor');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}}
function buildEditor(task){const wrapper=el('div','editor');const input=el('textarea');input.id='taskEditor';input.value=editing.text;input.setAttribute('aria-label','编辑待办内容');input.addEventListener('input',()=>{editing.text=input.value;});const controls=el('div','editor-actions');const cancel=button('small-button','取消编辑',null,()=>{editing=null;renderTasks(true);});cancel.textContent='取消';const save=button('small-button primary','保存编辑',null,async()=>{const text=input.value.trim();if(!text){toast('任务内容不能为空。',true);input.focus();return;}save.disabled=true;cancel.disabled=true;input.disabled=true;try{await sendAction({type:'update',taskId:task.id,path:editing.path,text});editing=null;renderTasks(true);toast('已保存到日记');}catch(e){toast(e.message,true);save.disabled=false;cancel.disabled=false;input.disabled=false;input.focus();}});save.textContent='保存';controls.append(cancel,save);input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel.click();}if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();save.click();}});wrapper.append(input,el('div','editor-hint','⌘ Enter 保存 · Esc 取消'),controls);return wrapper;}
function buildTask(task,tree={depth:0,hasNext:false,continuations:[],childCount:0,hasVisibleChildren:false}){const path=editing?.id===task.id?editing.path:state.path;const row=el('div','task '+(task.status||'todo'));row.style.setProperty('--depth',String(tree.depth));row.dataset.taskId=task.id;appendTreeGuides(row,tree);if(pendingTasks.has(task.id))row.classList.add('pending');const check=button('checkbox',task.status==='done'?'标记为未完成':'完成此任务',isDone(task)?(task.status==='done'?'check':'cancel'):task.status==='doing'?'clock':task.status==='deferred'?'arrow':null,()=>updateTask(task,{status:task.status==='done'?'todo':'done'},path));check.setAttribute('role','checkbox');check.setAttribute('aria-checked',String(task.status==='done'));check.disabled=pendingTasks.has(task.id);row.append(check);
if(editing?.id===task.id){row.append(buildEditor(task),childAddButton(task,path));return row;}
const copy=el('div','task-copy');const text=el('div','task-text',task.text);text.tabIndex=0;text.title='双击编辑';text.addEventListener('dblclick',()=>startEdit(task,path));text.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();startEdit(task,path);}});copy.append(text);if(task.status==='doing'||task.status==='deferred'){const badge=el('span','status-label',task.status==='doing'?'进行中':'稍后处理');badge.prepend(icon(task.status==='doing'?'clock':'arrow'));copy.append(badge);}row.append(copy);
const children=tree.childCount;if(children&&tree.allowFold!==false){const branch=button('branch',folded.has(foldKey(task))?'展开子任务':'折叠子任务','chevron',()=>{if(editing||draft){toast('先保存或取消正在输入的内容。');return;}if(folded.has(foldKey(task)))folded.delete(foldKey(task));else folded.add(foldKey(task));persistFolds();renderTasks();});branch.firstChild.classList.toggle('rotated',folded.has(foldKey(task)));branch.setAttribute('aria-expanded',String(!folded.has(foldKey(task))));row.append(branch);if(folded.has(foldKey(task))){branch.title=children+' 项子任务 · 点击展开';}}
const tools=el('div','task-tools');tools.append(button('icon-button','编辑任务','edit',()=>startEdit(task,path)),button('icon-button','修改任务状态','more',e=>openStatusMenu(task,e,path)));row.append(tools,childAddButton(task,path));return row;}
function emptyState(){const n=el('div','empty');const mark=el('div','empty-icon');mark.append(icon(state.connected?'leaf':'inbox'));n.append(mark);if(!state.connected){n.append(el('strong','','等待你的 Obsidian'),el('p','','从插件打开浮窗后，今天的待办会出现在这里。'));}else if(!state.exists){n.append(el('strong','','今天，从一件小事开始'),el('p','','还没有今天的日记。\n新增第一条待办时会自动创建。'));}else{n.append(el('strong','',state.tasks.length?'今天的待办已完成':'今天，想做些什么？'),el('p','',state.tasks.length?'留一点时间，给自己。':'新增一条待办，就从这里开始。'));}return n;}
function childAddButton(task,path){const b=button('icon-button add-child-button','添加子任务','plus',()=>startAdd(task,path));b.dataset.parentId=task.id;return b;}
function startAdd(parent=null,path=state.path){
 closeMenu();
 if(editing){toast('先保存或取消正在编辑的任务。');return;}
 if(draft){const same=draft.path===path&&((!parent&&draft.kind==='root')||(parent&&draft.kind==='child'&&(draft.parentId===parent.id||draft.parentKey===foldKey(parent))));if(same){$('newTaskInput')?.focus();$('newTaskInput')?.scrollIntoView({block:'nearest'});}else toast('先保存或取消正在新增的任务，草稿已保留。');return;}
 draft={kind:parent?'child':'root',path,parentId:parent?.id||null,parentKey:parent?foldKey(parent):null,parentText:parent?.text||'',parentStatus:parent?.status||'todo',text:'',busy:false};
 if(parent){folded.delete(foldKey(parent));persistFolds();}
 renderTasks(true);renderComposer();
 const input=$('newTaskInput');if(input){input.focus();input.scrollIntoView({block:'nearest'});}
}
function groupRows(tasks,completed){
 let prepared=tasks;
 if(draft?.kind==='child'&&isDone({status:draft.parentStatus})===completed){
  const matches=state.path===draft.path?tasks.filter(task=>task.id===draft.parentId||foldKey(task)===draft.parentKey):[];
  let parent=matches.length===1?matches[0]:null;
  if(!parent&&state.path===draft.path){const textMatches=tasks.filter(task=>task.text===draft.parentText);if(textMatches.length===1)parent=textMatches[0];}
  prepared=tasks.slice();
  if(!parent){parent={id:'__todoglass_draft_anchor__',uiKey:draft.parentKey,text:draft.parentText,status:draft.parentStatus,_anchor:true};prepared.push(parent);}
  // A draft is the first visual child, keeping its field beside the + button.
  // Saving still uses the original backend append order and snapshot IDs.
  const index=prepared.findIndex(task=>task===parent);
  prepared.splice(index+1,0,{id:'__todoglass_inline_draft__',parentId:parent.id,status:parent.status,text:'',_draft:true});
 }
 return visibleTree(prepared,completed);
}
function buildDraftRow(tree){const row=el('div','task composer inline-composer');row.style.setProperty('--depth',String(tree.depth));row.dataset.parentId=draft.parentId;appendTreeGuides(row,tree);const marker=el('span','draft-marker');marker.append(icon('plus'));row.append(marker,buildComposerFields(draft));return row;}
function appendGroup(list,tasks,completed){for(const {task,tree} of groupRows(tasks,completed)){if(task._draft){list.append(buildDraftRow(tree));continue;}const row=buildTask(task,tree);if(task._anchor)row.classList.add('draft-anchor');list.append(row);}}
function renderTasks(force=false){
 // Keep the actual input nodes, focus and selection unchanged during background
 // snapshots. The original path/IDs deliberately remain attached to each draft.
 if((editing||draft)&&!force){deferredRender=true;return;}deferredRender=false;
 const list=$('taskList');list.replaceChildren();const notice=$('notice');notice.replaceChildren();if(state.error)notice.append(el('div','notice',state.error));
 const active=state.tasks.filter(t=>!isDone(t)),done=state.tasks.filter(isDone);
 if(!active.length&&!draft){list.append(emptyState());}else{const head=el('div','section-head');head.append(el('span','','待办事项'),el('span','section-count',String(active.length)));list.append(head);appendGroup(list,active,false);}
 if(done.length||(draft?.kind==='child'&&isDone({status:draft.parentStatus}))){const head=el('div','done-head');head.append(el('span','','已结束'),el('span','section-count',String(done.length)));list.append(head);appendGroup(list,done,true);}
 // An edited task can disappear from a newer snapshot; retain its old draft.
 if(editing&&!state.tasks.some(t=>t.id===editing.id))list.append(buildTask({id:editing.id,text:editing.text,status:'todo'}));
}
function buildComposerFields(session){
 const fields=el('div','draft-fields');
 if(session.kind==='child')fields.append(el('div','inline-caption','添加子任务'));
 const input=el('textarea');input.id='newTaskInput';input.placeholder=session.kind==='child'?'写下这一步要做的事…':'写下你想完成的事…';input.setAttribute('aria-label',session.kind==='child'?'新增子任务内容':'新增待办内容');input.value=session.text;input.addEventListener('input',()=>{session.text=input.value;});
 const actions=el('div','editor-actions');
 const cancel=button('small-button','取消新增',null,()=>{if(session.busy||draft!==session)return;draft=null;renderTasks(true);renderComposer();});cancel.textContent='取消';
 const save=button('small-button primary','添加待办',null,async()=>{
  if(session.busy||draft!==session)return;const text=input.value.trim();if(!text){input.focus();return;}
  const selection=[input.selectionStart,input.selectionEnd,input.selectionDirection];session.busy=true;save.disabled=true;cancel.disabled=true;input.disabled=true;
  try{await sendAction({type:'add',text,path:session.path,...(session.kind==='child'?{parentId:session.parentId}:{})});if(draft===session){draft=null;renderTasks(true);renderComposer();toast('已添加到今日日记');}}
  catch(e){session.busy=false;if(draft!==session)return;toast(e.message,true);save.disabled=false;cancel.disabled=false;input.disabled=false;if(document.activeElement===save||document.activeElement===document.body||document.activeElement===input){input.focus();input.setSelectionRange(...selection);}}
 });save.textContent='添加';actions.append(cancel,save);
 input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel.click();}if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();save.click();}});
 fields.append(input,el('div','editor-hint','⌘ Enter 添加 · Esc 取消'),actions);return fields;
}
function renderComposer(){const box=$('composer');box.replaceChildren();if(draft?.kind==='root'){box.append(buildComposerFields(draft));return;}const b=button('add-trigger','新增待办','plus',()=>startAdd());b.append(el('span','','添加一件事'),el('span','shortcut','⌘ N'));box.append(b);}

window.TodoGlass={
 receive(next){if(!next||!Array.isArray(next.tasks))return;state={...state,...next,error:next.error||'',preferences:{...state.preferences,...next.preferences}};applyPreferences(state.preferences);if(typeof next.collapsed==='boolean')window.TodoGlass.setCollapsed(next.collapsed);refreshHeader();const fingerprint=JSON.stringify([state.tasks,state.connected,state.error,state.exists,state.path,state.date]);if(fingerprint!==lastFingerprint){lastFingerprint=fingerprint;renderTasks();}},
 result(result){const request=pending.get(result?.requestId);if(!request)return;clearTimeout(request.timer);pending.delete(result.requestId);if(result.ok)request.resolve(result);else request.reject(new Error(result.error||'保存失败，请重试。'));},
 setCollapsed(value){collapsed=Boolean(value);$('surface').classList.toggle('collapsed',collapsed);$('collapseButton').title=collapsed?'展开浮窗':'收起浮窗';$('collapseButton').setAttribute('aria-label',collapsed?'展开浮窗':'收起浮窗');$('collapseButton').setAttribute('aria-expanded',String(!collapsed));$('collapseButton').querySelector('svg').style.transform=collapsed?'rotate(180deg)':'';},
 disconnected(message){state.connected=false;refreshHeader();if(message)toast(message,true);}
};
$('refreshButton').addEventListener('click',()=>{bridge({type:'refresh'});toast('正在同步今日日记…');});
$('collapseButton').addEventListener('click',()=>{window.TodoGlass.setCollapsed(!collapsed);bridge({type:'collapse',collapsed});});
$('settingsButton').addEventListener('click',e=>{e.stopPropagation();if(collapsed){window.TodoGlass.setCollapsed(false);bridge({type:'collapse',collapsed:false});}const open=$('settingsPopover').classList.toggle('open');$('settingsButton').setAttribute('aria-expanded',String(open));});
$('settingsPopover').addEventListener('click',e=>e.stopPropagation());
$('themeSelect').addEventListener('change',e=>preferencesChanged({theme:e.target.value}));
$('opacityRange').addEventListener('input',e=>{document.documentElement.style.setProperty('--opacity',Number(e.target.value)/100);});
$('opacityRange').addEventListener('change',e=>preferencesChanged({opacity:Number(e.target.value)/100}));
$('alwaysOnTop').addEventListener('change',e=>preferencesChanged({alwaysOnTop:e.target.checked}));
$('noteLink').addEventListener('click',()=>bridge({type:state.connected?'openNote':'refresh'}));
$('openSettings').addEventListener('click',()=>{bridge({type:'settings'});$('settingsPopover').classList.remove('open');});
$('hideButton').addEventListener('click',()=>bridge({type:'hide'}));
$('dragHandle').addEventListener('mousedown',e=>{if(e.button===0&&!e.target.closest('button'))bridge({type:'drag'});});
$('dragHandle').addEventListener('dblclick',e=>{if(!e.target.closest('button'))$('collapseButton').click();});
document.addEventListener('click',()=>{closeMenu();$('settingsPopover').classList.remove('open');$('settingsButton').setAttribute('aria-expanded','false');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();$('settingsPopover').classList.remove('open');}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'&&!e.target.closest('textarea,input')){e.preventDefault();if(collapsed){window.TodoGlass.setCollapsed(false);bridge({type:'collapse',collapsed:false});}startAdd();}});
applyPreferences(state.preferences);refreshHeader();renderTasks();renderComposer();bridge({type:'ready'});
// Explicit preview only: use ?preview=1 in a regular browser. No note writes occur.
if(new URLSearchParams(location.search).get('preview')==='1'&&!window.webkit?.messageHandlers?.todoglass){window.TodoGlass.receive({date:'2026-11-02',path:'日记 / 2026-11-02.md',exists:true,connected:true,error:'界面预览 · 请从 Obsidian 打开以同步真实日记',tasks:[{id:'1',text:'把今天最重要的事，放在这里',status:'todo',depth:0},{id:'2',text:'为 Obsidian 做一个桌面待办浮窗',status:'doing',depth:0},{id:'3',parentId:'2',text:'让改动与日记实时同步',status:'todo',depth:1},{id:'4',parentId:'2',text:'整理一个清楚、舒服的界面',status:'todo',depth:1},{id:'5',text:'下楼走走，带一杯咖啡回来',status:'todo',depth:0},{id:'6',text:'安排好今天的节奏',status:'done',depth:0}]});}
})();
