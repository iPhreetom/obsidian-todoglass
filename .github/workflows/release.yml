name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the version files (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tag and version files
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag ?? '')) throw new Error('Expected a v-prefixed semantic version tag');
          const json = path => JSON.parse(readFileSync(path, 'utf8'));
          const manifest = json('manifest.json');
          const pkg = json('package.json');
          const lock = json('package-lock.json');
          const native = execFileSync('/usr/libexec/PlistBuddy', ['-c', 'Print :CFBundleShortVersionString', 'native/Info.plist'], { encoding: 'utf8' }).trim();
          const versions = [manifest.version, pkg.version, lock.version, lock.packages[''].version, native];
          if (versions.some(version => `v${version}` !== tag)) throw new Error(`Version mismatch: ${JSON.stringify(versions)} versus ${tag}`);
          const commit = ref => execFileSync('git', ['rev-parse', '--verify', ref], { encoding: 'utf8' }).trim();
          if (commit(`refs/tags/${tag}^{commit}`) !== commit('HEAD')) throw new Error('The checkout must be the existing release tag');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${manifest.version}\n`);
          NODE
      - name: Install public dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Check types
        run: npm run typecheck
      - name: Run automated tests
        run: npm test
      - name: Build Obsidian plugin
        run: npm run build
      - name: Build universal macOS helper
        run: npm run build:native
      - name: Verify native architectures and ad hoc signature
        run: |
          xcrun lipo dist/macos/TodoGlass.app/Contents/MacOS/TodoGlass -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/macos/TodoGlass.app
      - name: Package complete installation and source
        run: npm run package
      - name: Stage release files and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp dist/todoglass/main.js dist/todoglass/manifest.json release-assets/
          cp "dist/TodoGlass-${RELEASE_VERSION}-macOS.zip" "dist/TodoGlass-${RELEASE_VERSION}-source.zip" release-assets/
          cd release-assets
          shasum -a 256 main.js manifest.json ./*.zip > SHA256SUMS.txt
      - name: Pass only verified release files to publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download assets from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify transferred checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Create release with all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf '## TodoGlass %s\n\n' "$RELEASE_TAG" > release-notes.md
          printf '下载完整安装包：[TodoGlass-%s-macOS.zip](https://github.com/%s/releases/download/%s/TodoGlass-%s-macOS.zip)。\n\n' "$RELEASE_VERSION" "$GH_REPO" "$RELEASE_TAG" "$RELEASE_VERSION" >> release-notes.md
          cat >> release-notes.md <<'NOTES'
          安装请下载附件中以 **-macOS.zip** 结尾的完整安装包，解压后运行安装程序，或将整个 `todoglass` 文件夹复制到仓库的插件目录。

          `main.js` 与 `manifest.json` 单独安装无法提供 macOS 浮窗；必须保留完整包中的 `macos/TodoGlass.app`。

          Requires macOS 13+ and Obsidian desktop 1.8.7+. Obsidian must remain running. The universal helper includes arm64 and x86_64, uses an ad hoc signature, and is not Apple notarized. Physical device validation has used macOS 26.5 on Apple Silicon; Intel/macOS 13 are build targets, not completed device tests.

          Source code and SHA-256 checksums are included. See the repository README for usage, local-only data flow, compatibility limits and the MIT license.
          NOTES
          if existing_draft=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft 2> release-lookup-error.txt); then
            if [[ "$existing_draft" == 'false' ]]; then
              # A published release may be immutable or edited by its maintainer.
              # Validate the existing assets and leave every remote field intact.
              mkdir -p existing-release
              for asset in release-assets/*; do
                gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$(basename "$asset")" --dir existing-release
              done
              (cd existing-release && sha256sum --check SHA256SUMS.txt)
              echo 'The published release is complete; no remote files or metadata were changed.'
              exit 0
            fi
            if [[ "$existing_draft" != 'true' ]]; then
              echo 'Unexpected release state; refusing to change it.' >&2
              exit 1
            fi
            # Resume a draft by replacing only this workflow's generated assets.
            # Preserve its title, body and any additional maintainer attachments.
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --verify-tag --draft --title "TodoGlass $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
